[cmake]
version = "3.21"

[project]
name = "SocketSL"
version = "0.1.0"
languages = ["CXX"]
cmake-after = """
# Sub-project options
set(FLATBUFFERS_BUILD_TESTS OFF CACHE BOOL "" FORCE)
set(FLATBUFFERS_INSTALL OFF CACHE BOOL "" FORCE)
set(FLATBUFFERS_BUILD_FLATC ON CACHE BOOL "" FORCE)
set(SPDLOG_BUILD_EXAMPLE OFF CACHE BOOL "" FORCE)

# Only fetch the Boost libraries we use
set(BOOST_INCLUDE_LIBRARIES system asio endian CACHE STRING "" FORCE)

# Disable LibreSSL extras
set(LIBRESSL_APPS OFF CACHE BOOL "" FORCE)
set(LIBRESSL_TESTS OFF CACHE BOOL "" FORCE)
set(LIBRESSL_INSTALL OFF CACHE BOOL "" FORCE)

# Tests (googletest): match the rest of the build's MSVC runtime, skip install
option(SOCKETSL_BUILD_TESTS "Build the SocketSL test suite" ON)
set(CMAKE_POLICY_DEFAULT_CMP0091 NEW)
set(INSTALL_GTEST OFF CACHE BOOL "" FORCE)
"""

[fetch-content.spdlog]
git = "https://github.com/gabime/spdlog.git"
tag = "v1.15.3"

[fetch-content.flatbuffers]
git = "https://github.com/google/flatbuffers.git"
tag = "v24.12.23"

[fetch-content.Boost]
git = "https://github.com/boostorg/boost.git"
tag = "boost-1.88.0"

[fetch-content.libressl]
url = "https://github.com/libressl/portable/releases/download/v4.0.0/libressl-4.0.0.tar.gz"

[fetch-content.googletest]
git = "https://github.com/google/googletest.git"
tag = "v1.15.2"
shallow = true

[target.socketsl]
type = "static"
sources = [
    "src/network/socket.cpp",
    "src/network/ssl.cpp",
    "src/message/message.cpp",
    "src/connection/session.cpp",
    "src/connection/session_manager.cpp",
]
include-directories = ["src"]
compile-features = ["cxx_std_20"]
link-libraries = [
    "flatbuffers",
    "Boost::system",
    "Boost::asio",
    "Boost::endian",
    "ssl",
    "crypto",
]
cmake-after = """
# FlatBuffers code generation
set(FBS_GENERATED_DIR "${CMAKE_CURRENT_BINARY_DIR}/generated/schema")
file(MAKE_DIRECTORY "${FBS_GENERATED_DIR}")

set(FBS_FILES
    "${CMAKE_CURRENT_SOURCE_DIR}/src/message/message.fbs"
    "${CMAKE_CURRENT_SOURCE_DIR}/examples/client_server/request.fbs"
    "${CMAKE_CURRENT_SOURCE_DIR}/examples/client_server/response.fbs"
    "${CMAKE_CURRENT_SOURCE_DIR}/examples/peer/peer.fbs"
)

if(SOCKETSL_BUILD_TESTS)
    list(APPEND FBS_FILES "${CMAKE_CURRENT_SOURCE_DIR}/tests/test_message.fbs")
endif()

set(FBS_GENERATED_HEADERS)
foreach(FBS_FILE ${FBS_FILES})
    get_filename_component(FBS_NAME "${FBS_FILE}" NAME_WE)
    set(FBS_OUTPUT "${FBS_GENERATED_DIR}/${FBS_NAME}_generated.h")
    add_custom_command(
        OUTPUT "${FBS_OUTPUT}"
        COMMAND $<TARGET_FILE:flatc> --cpp -o "${FBS_GENERATED_DIR}" "${FBS_FILE}"
        DEPENDS flatc "${FBS_FILE}"
        COMMENT "Generating ${FBS_NAME}_generated.h"
    )
    list(APPEND FBS_GENERATED_HEADERS "${FBS_OUTPUT}")
endforeach()

add_custom_target(generate_flatbuffers DEPENDS ${FBS_GENERATED_HEADERS})

target_sources(socketsl PRIVATE ${FBS_GENERATED_HEADERS})
target_include_directories(socketsl PUBLIC "${CMAKE_CURRENT_BINARY_DIR}/generated")
add_dependencies(socketsl generate_flatbuffers)

# Threading
find_package(Threads REQUIRED)
target_link_libraries(socketsl PUBLIC Threads::Threads)

# Platform-specific
if(WIN32)
    target_link_libraries(socketsl PUBLIC crypt32)
endif()

if(MSVC)
    target_compile_options(socketsl PUBLIC /utf-8 /Zc:preprocessor)
endif()

if(WIN32)
    target_compile_definitions(socketsl PUBLIC _WIN32_WINNT=0x0A00)
endif()
"""

[target.server]
type = "executable"
sources = [
    "examples/client_server/server_main.cpp",
]
include-directories = ["examples/client_server"]
link-libraries = ["socketsl", "spdlog::spdlog"]

[target.client]
type = "executable"
sources = [
    "examples/client_server/client_main.cpp",
]
include-directories = ["examples/client_server"]
link-libraries = ["socketsl", "spdlog::spdlog"]

[target.peer]
type = "executable"
sources = [
    "examples/peer/main.cpp",
]
include-directories = ["examples/peer"]
link-libraries = ["socketsl", "spdlog::spdlog"]

[target.tests]
type = "executable"
condition = "SOCKETSL_BUILD_TESTS"
sources = [
    "tests/test_endian.cpp",
    "tests/test_serialisation.cpp",
    "tests/test_message.cpp",
    "tests/test_router.cpp",
]
include-directories = ["tests"]
link-libraries = ["socketsl", "GTest::gtest", "GTest::gtest_main"]
cmake-after = """
enable_testing()
add_dependencies(tests generate_flatbuffers)
include(GoogleTest)
gtest_discover_tests(tests)
"""
